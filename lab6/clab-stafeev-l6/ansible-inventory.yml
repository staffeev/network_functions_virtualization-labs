        clab-stafeev-l6-fw1:
          ansible_host: 10.106.26.5
        clab-stafeev-l6-odl:
          ansible_host: 10.106.26.100
        clab-stafeev-l6-server:
          ansible_host: 10.106.26.2
        clab-stafeev-l6-shaper1:
          ansible_host: 10.106.26.6
        clab-stafeev-l6-sw:
