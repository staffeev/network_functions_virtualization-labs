# Описание сервисных цепочек (VNF Forwarding Graph) — упрощённый аналог ETSI VNFFGD.
# Переменные ${N} и ${STUDENT} подставляются из окружения.
controller: {url: "http://10.106.26.100:8181", user: admin, password: admin}
switch: "openflow:1"

# Конечные точки: номер порта OpenFlow на OVS и IP-адрес
endpoints:
  client1: {port: 1, ip: "10.26.6.11"}
  client2: {port: 2, ip: "10.26.6.12"}
  server:  {port: 9, ip: "10.26.6.100"}

# Экземпляры VNF: порт входа (со стороны клиентов) и выхода (со стороны сервера)
vnfs:
  fw1:     {type: fw,     in: 3, out: 4}
  fw2:     {type: fw,     in: 5, out: 6}     # появится после scale-out (этап 4)
  shaper1: {type: shaper, in: 7, out: 8}

# Цепочки: от кого, к кому и через какие VNF
chains:
  - {name: "stafeev-c1", from: client1, to: server, path: [fw2, shaper1]}
  - {name: "stafeev-c2", from: client2, to: server, path: [fw2, shaper1]}
