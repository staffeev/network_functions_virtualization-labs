vnfd:
  id: vnf-shaper
  provider: "stafeev"
  version: "1.0"
  description: "Прозрачный шейпер трафика (bridge + tc), вставляется в разрыв"
  sw_image: lab-tools:1.0
  vdu:
    resources: {vcpu: 1, memory_mb: 64}
  ext_cp:
    - {id: cp-in,  iface: eth1, role: "сторона клиентов"}
    - {id: cp-out, iface: eth2, role: "сторона сервера"}
  config: vnf/shaper-rules.tc
  scaling: {min_instances: 1, max_instances: 1}
  lcm_operations: [instantiate, configure, terminate]