all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    linux:
      hosts:
        clab-stafeev-l4-h1:
          ansible_host: 10.104.26.3
        clab-stafeev-l4-h2:
          ansible_host: 10.104.26.2
        clab-stafeev-l4-h3:
          ansible_host: 10.104.26.4
        clab-stafeev-l4-odl:
          ansible_host: 10.104.26.100
        clab-stafeev-l4-s1:
          ansible_host: 10.104.26.11
        clab-stafeev-l4-s2:
          ansible_host: 10.104.26.12