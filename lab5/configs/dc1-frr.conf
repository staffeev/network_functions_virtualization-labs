!
frr version 7.5.1-sonic
frr defaults traditional
hostname dc1
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 65026
 bgp router-id 10.26.1.1
 no bgp ebgp-requires-policy
 neighbor 10.26.1.2 remote-as 65126
 !
 address-family ipv4 unicast
  network 10.26.100.0/24
 exit-address-family
!
line vty
!
end
